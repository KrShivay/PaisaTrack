name: paisatrack
description: SMS-based intelligent expense tracker.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  drift: 2.18.0
  sqlite3: ^2.4.0
  sqlcipher_flutter_libs: ^0.6.1
  cryptography: ^2.7.0
  path_provider: ^2.1.3
  path: ^1.9.0
  workmanager: ^0.9.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: 2.18.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/templates/
    - assets/seed/
    - assets/icons/
