name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  flutter-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Verify generated Drift code is current
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib/data/db/database.g.dart
      - run: flutter analyze
      - run: flutter test
